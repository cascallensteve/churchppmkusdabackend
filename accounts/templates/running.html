<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKUSD Treasury - System Running</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(76, 175, 80, 0.2);
            padding: 15px 30px;
            border-radius: 50px;
            margin-bottom: 30px;
            border: 1px solid rgba(76, 175, 80, 0.5);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .info-card h3 {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-card p {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .api-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .api-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏛️</div>
        <h1>MKUSD Treasury</h1>
        <p class="subtitle">Backend Authentication System</p>

        <div class="status">
            <div class="status-dot"></div>
            <span>System is Running</span>
        </div>

        <div class="info-grid">
            <div class="info-card">
                <h3>Status</h3>
                <p>✅ Online</p>
            </div>
            <div class="info-card">
                <h3>Database</h3>
                <p id="database">Checking...</p>
            </div>
            <div class="info-card">
                <h3>Environment</h3>
                <p id="environment">Development</p>
            </div>
            <div class="info-card">
                <h3>API Version</h3>
                <p>v1.0</p>
            </div>
        </div>

        <a href="/api/auth/account/profile/" class="api-link">View API Documentation</a>

        <div class="footer">
            <p>© 2026 MKUSD Church Treasury System</p>
            <p>Secure Authentication with JWT & PIN</p>
        </div>
    </div>

    <script>
        fetch('/api/auth/account/me/', {
            method: 'GET',
            headers: {
                'Accept': 'application/json',
            }
        })
        .then(response => {
            if (response.ok) {
                document.getElementById('database').textContent = '✅ Connected';
                document.getElementById('database').style.color = '#4CAF50';
            } else {
                document.getElementById('database').textContent = '⚠️ Check DB';
                document.getElementById('database').style.color = '#FF9800';
            }
        })
        .catch(error => {
            document.getElementById('database').textContent = '❌ Offline';
            document.getElementById('database').style.color = '#f44336';
        });
    </script>
</body>
</html>
